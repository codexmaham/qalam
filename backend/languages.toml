# Qalam language registry.
# Add a language by adding a font file under fonts/ and a block below.
# See CONTRIBUTING.md, section "Add a language".

[fonts.caveat]
file = "Caveat-wght.ttf"
family = "Caveat"
style = "handwriting"
jitter = "glyph"
jitter_amount = 1.0
weight = 580
line_mm = 10.0
body_ratio = 0.70
scripts = ["Latn", "Cyrl"]
note = "Pen handwriting for Latin, with Cyrillic as well."

[fonts.patrick-hand]
file = "PatrickHand-Regular.ttf"
family = "Patrick Hand"
style = "handwriting"
jitter = "glyph"
jitter_amount = 0.85
line_mm = 10.0
body_ratio = 0.66
scripts = ["Latn"]
note = "Handwriting face with full Vietnamese diacritics."

[fonts.bad-script]
file = "BadScript-Regular.ttf"
family = "Bad Script"
style = "handwriting"
jitter = "glyph"
jitter_amount = 0.4
line_mm = 10.5
body_ratio = 0.64
scripts = ["Cyrl", "Latn"]
note = "Cursive Cyrillic handwriting."

[fonts.kalam]
file = "Kalam-Regular.ttf"
family = "Kalam"
style = "handwriting"
jitter = "cluster"
jitter_amount = 0.7
line_mm = 11.5
body_ratio = 0.58
scripts = ["Deva", "Latn"]
note = "Devanagari handwriting."

[fonts.aref-ruqaa-ink]
file = "ArefRuqaaInk-Regular.ttf"
family = "Aref Ruqaa Ink"
style = "handwriting"
jitter = "joining"
jitter_amount = 0.8
line_mm = 14.5
body_ratio = 0.48
scripts = ["Arab"]
note = "Ruqʿah handwriting for Arabic and Persian."

[fonts.gulzar]
file = "Gulzar-Regular.ttf"
family = "Gulzar"
style = "handwriting"
jitter = "joining"
jitter_amount = 0.55
line_mm = 18.0
body_ratio = 0.40
scripts = ["Arab"]
note = "Nastaliq, the everyday handwriting style for Urdu and Shahmukhi."

[fonts.lateef]
file = "Lateef-Regular.ttf"
family = "Lateef"
style = "text"
jitter = "joining"
jitter_amount = 0.45
line_mm = 12.0
body_ratio = 0.58
scripts = ["Arab"]
note = "Naskh text face. No open handwriting font yet covers Pashto and Sindhi."

[fonts.mukta-mahee]
file = "MuktaMahee-Regular.ttf"
family = "Mukta Mahee"
style = "text"
jitter = "cluster"
jitter_amount = 0.45
line_mm = 11.0
body_ratio = 0.60
scripts = ["Guru", "Latn"]
note = "Humanist Gurmukhi. No widely used open handwriting face for this script yet."

[fonts.galada]
file = "Galada-Regular.ttf"
family = "Galada"
style = "handwriting"
jitter = "cluster"
jitter_amount = 0.35
line_mm = 12.0
body_ratio = 0.58
scripts = ["Beng", "Latn"]
note = "Casual Bengali brush face."

