[[languages]]
id = "en"
name = "English"
native = "English"
direction = "ltr"
script = "Latn"
family = "Latin"
font = "caveat"
fallbacks = ["patrick-hand"]
recommended = ["four-line", "single-ruled"]
sample = """Speak it. See it handwritten. Print it.

Today the class wrote this page by talking, and the notebook did the rest. The quick brown fox jumps over the lazy dog."""

